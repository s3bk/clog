[package]
name = "analytics"
version = "0.1.0"
edition = "2021"

[dependencies]
clog_core = { path = "../core" }
clog_collector = { path = "../collector" }
linfa = "0.8"
linfa-trees = { version = "0.8", features = ["serde"] }
ndarray = { version = "0.16", features = ["serde"] }
dashmap = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
bincode = "1"
rand = "0.8"
aho-corasick = "1"

[[bin]]
name = "demo"
path = "src/bin/main.rs"
